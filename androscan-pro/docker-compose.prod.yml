# Complemento de endurecimiento. Requiere revisar TLS/reverse proxy antes de exposición pública.
services:
  api:
    environment:
      APP_ENV: production
    restart: unless-stopped
  worker:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  minio:
    restart: unless-stopped
  frontend:
    profiles: ["development"]
